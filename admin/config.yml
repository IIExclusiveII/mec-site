backend:
  name: git-gateway
  branch: main

site_url: "https://mecua.netlify.app"
display_url: "https://mecua.netlify.app"
logo_url: "https://mecua.netlify.app/favicon.svg"

media_folder: "images/gallery"
public_folder: "/images/gallery"

locale: "uk"

collections:
  - name: "home"
    label: "Головна сторінка"
    files:
      - name: "hero"
        label: "Головний екран (перший блок)"
        file: "content/home.json"
        description: "Великий заголовок, текст, кнопки та цифри у самому верху головної сторінки."
        fields:
          - {label: "Значок над заголовком", name: "badge", widget: "string", hint: "напр. Працюємо по всій Україні"}
          - {label: "Заголовок — рядок 1", name: "titleLine1", widget: "string"}
          - {label: "Заголовок — рядок 2 (кольоровий)", name: "titleLine2", widget: "string"}
          - {label: "Заголовок — рядок 3", name: "titleLine3", widget: "string"}
          - {label: "Опис під заголовком", name: "subtitle", widget: "text"}
          - {label: "Напис на головній кнопці", name: "primaryBtn", widget: "string", hint: "веде на телефон із розділу «Контакти»"}
          - {label: "Напис на другій кнопці", name: "secondaryBtn", widget: "string", hint: "веде на сторінку «Послуги»"}
          - label: "Цифри (4 штуки)"
            name: "stats"
            widget: "list"
            max: 4
            min: 4
            summary: "{{num}} — {{label}}"
            fields:
              - {label: "Число", name: "num", widget: "string", hint: "напр. 2015, 1000+, 10 кВ, 100%"}
              - {label: "Підпис", name: "label", widget: "string"}

  - name: "social"
    label: "Соцмережі"
    files:
      - name: "social"
        label: "Посилання на соцмережі"
        file: "content/social.json"
        description: "Іконки з'являються у футері на всіх сторінках. Порожнє поле = іконки немає. Можна вставляти повне посилання або без https://."
        fields:
          - {label: "Instagram", name: "instagram", widget: "string", required: false, hint: "напр. instagram.com/mec_kyiv"}
          - {label: "Facebook", name: "facebook", widget: "string", required: false}
          - {label: "Telegram (канал або чат)", name: "telegram", widget: "string", required: false, hint: "напр. t.me/mec_kyiv"}
          - {label: "Viber (посилання-запрошення)", name: "viber", widget: "string", required: false}
          - {label: "YouTube", name: "youtube", widget: "string", required: false}
          - {label: "TikTok", name: "tiktok", widget: "string", required: false}

  - name: "gallery"
    label: "Галерея робіт"
    files:
      - name: "gallery"
        label: "Фотографії виконаних робіт"
        file: "content/gallery.json"
        description: "Ці фото показуються на Головній сторінці та на сторінці Галерея. Додайте нові, приберіть старі або поміняйте місцями."
        fields:
          - label: "Фотографії"
            name: "items"
            widget: "list"
            summary: "{{title}}"
            fields:
              - {label: "Фото", name: "src", widget: "image", hint: "Завантажте фото виконаної роботи (JPG/PNG, бажано горизонтальне, до 2-3 МБ)."}
              - {label: "Заголовок", name: "title", widget: "string", hint: "Наприклад: Монтаж КТП"}
              - {label: "Короткий опис", name: "desc", widget: "string", hint: "Одне речення, наприклад: Комплектна трансформаторна підстанція"}
              - {label: "Alt-текст для Google", name: "alt", widget: "string", hint: "Опис фото для пошукових систем, наприклад: Монтаж трансформаторної підстанції КТП у Києві"}

  - name: "services"
    label: "Послуги"
    files:
      - name: "services"
        label: "Список послуг"
        file: "content/services.json"
        description: "Показуються на Головній (перші 6) і повністю на сторінці Послуги."
        fields:
          - label: "Послуги"
            name: "items"
            widget: "list"
            summary: "{{title}}"
            fields:
              - label: "Іконка"
                name: "icon"
                widget: "select"
                hint: "Візуальна іконка картки"
                options:
                  - {label: "Кабель", value: "cable"}
                  - {label: "Панель/ТП", value: "panel"}
                  - {label: "Щит/сертифікат", value: "shield"}
                  - {label: "Індикатор", value: "gauge"}
                  - {label: "Заземлення", value: "ground"}
                  - {label: "Лабораторія", value: "lab"}
                  - {label: "Блискавка", value: "bolt"}
                  - {label: "Пошук", value: "search"}
                  - {label: "Випробування", value: "test"}
                  - {label: "Гайковий ключ", value: "wrench"}
                  - {label: "Автовишка", value: "crane"}
                  - {label: "Живлення", value: "power"}
                  - {label: "Будівля/ТП", value: "building"}
                  - {label: "Документ", value: "document"}
              - {label: "Назва послуги", name: "title", widget: "string"}
              - {label: "Опис", name: "desc", widget: "text"}

  - name: "contacts"
    label: "Контакти"
    files:
      - name: "contacts"
        label: "Телефон, email, графік роботи"
        file: "content/contacts.json"
        description: "Ці дані показуються на всіх сторінках сайту — у шапці, футері та на сторінці Контакти."
        fields:
          - {label: "Телефон для посилань tel: (тільки цифри, з +)", name: "phoneHref", widget: "string", hint: "Наприклад: +380985212269"}
          - {label: "Телефон для показу на сайті", name: "phoneDisplay", widget: "string", hint: "Наприклад: +380 (98) 521 22 69"}
          - {label: "E-mail", name: "email", widget: "string"}
          - {label: "Графік Пн-Пт", name: "hoursWeekday", widget: "string"}
          - {label: "Графік Сб-Нд", name: "hoursWeekend", widget: "string"}
          - {label: "Текст про аварійний виїзд", name: "emergencyNote", widget: "string"}
          - {label: "Зона обслуговування (текст)", name: "serviceArea", widget: "text"}

  - name: "about"
    label: "Про нас"
    files:
      - name: "about"
        label: "Текст сторінки Про нас"
        file: "content/about.json"
        fields:
          - {label: "Абзаци тексту", name: "intro", widget: "list", field: {label: "Абзац", name: "paragraph", widget: "text"}}
          - {label: "Список переваг (короткі пункти)", name: "highlights", widget: "list", field: {label: "Пункт", name: "item", widget: "string"}}
          - label: "Картки фактів (4 штуки)"
            name: "facts"
            widget: "list"
            summary: "{{title}}"
            fields:
              - {label: "Заголовок", name: "title", widget: "string"}
              - {label: "Текст", name: "text", widget: "string"}

  - name: "faq"
    label: "FAQ"
    files:
      - name: "faq"
        label: "Питання та відповіді"
        file: "content/faq.json"
        description: "Перші 3 показуються на Головній, усі — на сторінці FAQ."
        fields:
          - label: "Питання"
            name: "items"
            widget: "list"
            summary: "{{question}}"
            fields:
              - {label: "Питання", name: "question", widget: "string"}
              - {label: "Відповідь", name: "answer", widget: "text"}

  - name: "map"
    label: "Карта об'єктів"
    files:
      - name: "map"
        label: "Позначки виконаних робіт на карті"
        file: "content/map.json"
        description: "Карта показується на сторінці «Про нас». Кожна позначка — окремий об'єкт. Обов'язкові тільки координати; опис і фото — за бажанням. Без опису й фото позначка на карті буде видна, але при натисканні на неї нічого не відкриється."
        fields:
          - label: "Позначки"
            name: "items"
            widget: "list"
            summary: "{{location}}"
            fields:
              - label: "Місце: адреса, посилання Google Maps або координати"
                name: "location"
                widget: "string"
                hint: "Підійде будь-що: (1) адреса текстом, наприклад «вул. Соборна 27, Біла Церква» — координати підберуться автоматично; (2) посилання з кнопки «Поділитися» на Google Maps (зокрема коротке maps.app.goo.gl або goo.gl/maps) — можна вставляти разом із текстом, що додає телефон; (3) координати «50.4501, 30.5234» — правою кнопкою по місцю на карті Google. Якщо позначка не з'явилась — уточніть адресу (додайте місто) або скористайтесь mecua.netlify.app/admin/find-coordinates.html."
              - {label: "Адреса (текст для показу у вікні)", name: "address", widget: "string", required: false}
              - {label: "Опис виконаної роботи", name: "description", widget: "text", required: false}
              - label: "Фото об'єкта"
                name: "photos"
                widget: "list"
                required: false
                field: {label: "Фото", name: "image", widget: "image", media_folder: "/images/map", public_folder: "/images/map"}
