<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>МЕС — Статистика відвідувань</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root{--bg:#060a10;--bg2:#0b1118;--bg3:#0f1820;--gold:#e8a020;--cyan:#00c8e8;--white:#f0f4f8;--gray:#8090a0;--gray2:#2c3b4a}
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--white);line-height:1.55}
    .wrap{max-width:860px;margin:0 auto;padding:36px 20px 80px}
    a{color:var(--cyan)}
    h1{font-size:22px;margin:0 0 4px}
    p.lead{color:var(--gray);font-size:13px;margin:0 0 22px}
    .range{display:flex;gap:8px;margin-bottom:22px}
    .range button{background:var(--bg3);border:1px solid var(--gray2);color:var(--gray);padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px}
    .range button.active{background:var(--gold);border-color:var(--gold);color:var(--bg);font-weight:600}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:26px}
    .card{background:var(--bg2);border:1px solid var(--gray2);border-radius:10px;padding:16px 18px}
    .card .n{font-size:28px;font-weight:700;color:var(--gold);line-height:1}
    .card .l{font-size:12px;color:var(--gray);margin-top:6px}
    h2{font-size:15px;margin:26px 0 12px;color:var(--white)}
    .chart{display:flex;align-items:flex-end;gap:3px;height:140px;background:var(--bg2);border:1px solid var(--gray2);border-radius:10px;padding:14px 12px}
    .bar{flex:1;background:linear-gradient(180deg,var(--cyan),#0891a8);border-radius:2px 2px 0 0;min-height:2px;position:relative}
    .bar:hover::after{content:attr(data-tip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--bg3);border:1px solid var(--gray2);color:var(--white);font-size:11px;padding:3px 7px;border-radius:4px;margin-bottom:4px;z-index:2}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--gray2)}
    th{color:var(--gray);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
    td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--gold)}
    .status{color:var(--gray);font-size:13px;padding:20px 0}
    .back{display:inline-block;margin-top:30px;font-size:13px}
    .note{color:var(--gray);font-size:12px;margin-top:8px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Статистика відвідувань</h1>
    <p class="lead">Без cookie, без стеження за людьми — лише кількість переглядів. Дані бачите тільки ви.</p>

    <div class="range" id="range">
      <button data-d="7">7 днів</button>
      <button data-d="30" class="active">30 днів</button>
      <button data-d="90">90 днів</button>
    </div>

    <div id="content"><div class="status">Завантаження…</div></div>

    <a class="back" href="/admin/">&#8592; Повернутись в адмінпанель</a>
  </div>

  <script>
    var content = document.getElementById('content');
    var range = document.getElementById('range');
    var days = 30;

    function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

    async function load() {
      content.innerHTML = '<div class="status">Завантаження…</div>';
      var data;
      try {
        var res = await fetch('/.netlify/functions/stats?days=' + days, { cache: 'no-store' });
        data = await res.json();
      } catch (e) {
        content.innerHTML = '<div class="status">Не вдалося завантажити статистику.</div>';
        return;
      }
      if (data.error && !data.total) {
        content.innerHTML = '<div class="status">Дані ще збираються. Загляньте пізніше — статистика з\'явиться після перших відвідувань (і деплою з новим кодом).</div>';
        return;
      }
      var maxDay = Math.max(1, Math.max.apply(null, data.days.map(function (d) { return d.total; })));
      var avg = Math.round(data.total / Math.max(1, data.days.length));
      var bars = data.days.map(function (d) {
        var h = Math.round((d.total / maxDay) * 100);
        var dt = d.date.slice(8) + '.' + d.date.slice(5, 7);
        return '<div class="bar" style="height:' + h + '%" data-tip="' + dt + ': ' + d.total + '"></div>';
      }).join('');
      var pagesRows = (data.topPages || []).map(function (p) {
        return '<tr><td>' + esc(p[0]) + '</td><td class="num">' + p[1] + '</td></tr>';
      }).join('') || '<tr><td colspan="2" style="color:var(--gray)">—</td></tr>';
      var refRows = (data.topRefs || []).map(function (r) {
        return '<tr><td>' + esc(r[0]) + '</td><td class="num">' + r[1] + '</td></tr>';
      }).join('') || '<tr><td colspan="2" style="color:var(--gray)">—</td></tr>';

      content.innerHTML =
        '<div class="cards">' +
          '<div class="card"><div class="n">' + data.total + '</div><div class="l">переглядів за ' + data.range + ' дн.</div></div>' +
          '<div class="card"><div class="n">' + avg + '</div><div class="l">у середньому за день</div></div>' +
          '<div class="card"><div class="n">' + (data.topPages ? data.topPages.length : 0) + '</div><div class="l">сторінок відвідано</div></div>' +
        '</div>' +
        '<h2>Перегляди по днях</h2><div class="chart">' + bars + '</div>' +
        '<h2>Популярні сторінки</h2><table><thead><tr><th>Сторінка</th><th class="num">Перегляди</th></tr></thead><tbody>' + pagesRows + '</tbody></table>' +
        '<h2>Звідки приходять</h2><table><thead><tr><th>Джерело</th><th class="num">Переходи</th></tr></thead><tbody>' + refRows + '</tbody></table>' +
        '<div class="note">Підрахунок приблизний (± кілька переглядів при одночасних заходах). Час — UTC.</div>';
    }

    range.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      days = parseInt(b.dataset.d, 10);
      [].forEach.call(range.children, function (x) { x.classList.toggle('active', x === b); });
      load();
    });
    load();
  </script>
</body>
</html>
